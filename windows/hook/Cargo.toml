[package]
name = "coucou-hook"
description = "Relays Claude Code hook events to Coucou over a named pipe (Windows) or Unix socket (Linux/macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

# The relay uses std's blocking sockets/pipe directly — no async runtime — so it
# starts fast and has almost no dependency weight (Claude Code spawns it on every
# hook event).
[dependencies]
serde_json = "1"
dirs = "5"

# Windows: named pipe + SID check
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
