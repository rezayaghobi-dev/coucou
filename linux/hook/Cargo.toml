[package]
name = "coucou-hook"
description = "Relays Claude Code hook events to Coucou over a Unix domain socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

# The relay uses std's blocking sockets/pipe directly — no async runtime — so it
# starts fast and has almost no dependency weight (Claude Code spawns it on every
# hook event).
[dependencies]
serde_json = "1"
dirs = "5"
